# Agent Registry — authoritative list of every agent identity that may appear in
# provenance (plan v2 E4.2; audit F2). Companion of relation-registry.yaml and
# extension-registry.yaml (governance metadata, not canonical knowledge).
#
# Every `human:` / `process:` / `llm:` / `unknown:` identifier referenced by
#   connections/*.yaml   provenance.asserted_by.id, provenance.generated_by.id,
#                        provenance.reviewed_by[].id, provenance.review_history[].reviewer
#   content/**/*.md      provenance.reviewer (when non-null)
#   schema/extension-registry.yaml  registered_by
# MUST resolve to an entry here or scripts/validate.py exits 1.
#
# Fields
#   id           — the agent identifier exactly as written in provenance
#   class        — human | process | llm | unknown (must equal the id prefix)
#   display_name — human-readable label (pseudonymous display is allowed; E6.5)
#   external_id  — namespaced anchor when known: orcid:0000-..., github:handle,
#                  model:vendor/name@version. null while unknown. Reviewer identity
#                  policy (ORCID-backed recommended) is gate G-D (plan v2 E6.5).
#   status       — active | retired | test
#   note         — free text (why this agent exists, scope, caveats)
#
# `unknown:legacy-relationship` is deliberately registered: it is the honest
# attribution for the 641 migrated assertions whose original author is not
# recoverable (CURATION-PROTOCOL §6: origin is preserved, never rewritten).
#
# New agents: append an entry in the same PR that first uses the id.
# No new canonical assertion may use an `unknown:` agent (plan v2 §4 metric).
version: '0.1'
