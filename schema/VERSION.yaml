# STEMMA — single authoritative version source (ADR-0022; ADR-0027/0028 refoundation)
#
# Every producer of derived artifacts (scripts/validate.py, export_review_aware.py,
# graph_analysis.py) MUST read its version constants from this file. Version literals
# in scripts are forbidden.
#
# schema_version   — '1.0.0' version of the canonical JSON Schemas. Major bump from
#                    0.2: the stemma: namespace replaces lhs: in every ID pattern and
#                    the deprecated entity-side relationships[] projection is removed
#                    from concept.schema.json (ADR-0027/0028).
# export_version   — '2.0.0' version of the exports/knowledge.json consumer contract.
#                    Breaking: entities[].relationships (generated projection) is gone;
#                    the relationship graph is connections[] only; all IDs are
#                    stemma:-namespaced. Consumers must read connections[] and use
#                    stemma: IDs (see docs/MIGRATIONS.md 2026-09-04 entry).
#                    The v1.x legacy co-release artifact (knowledge.compat-0.1.json)
#                    is retired with this bump.
# relation_registry_version — '1.0.0' version of schema/relation-registry.yaml.
#                    Major bump from 0.3: reserved duplicate relations removed
#                    (broader_than/narrower_than duplicated generalizes/
#                    special_case_of; contains duplicated has_part; is_a duplicated
#                    special_case_of for taxonomic use). No adopted relation changed.

schema_version: '1.0.0'
export_version: '2.0.0'
relation_registry_version: '1.0.0'
