# STEMMA — single authoritative version source (ADR-0022, plan v2 E5.1)
#
# Every producer of derived artifacts (scripts/validate.py, export_review_aware.py,
# graph_analysis.py) MUST read its version constants from this file. Version literals
# in scripts are forbidden (audit finding F5: four disagreeing version signals).
#
# schema_version   — version of the canonical JSON Schemas (they self-describe v0.2).
# export_version   — version of the exports/knowledge.json consumer contract.
#                    1.0 (ADR-0023, gate G-A decided 2026-09-04): `connections` and
#                    `sources` are REQUIRED members; shape enforced by
#                    schema/export.schema.json. The inline `relationships[]`
#                    projection is deprecated and removed at 2.0 (E1.7).
# legacy_export_version — contract of the compatibility artifact
#                    exports/knowledge.compat-0.1.json (entities only), emitted during
#                    the consumer co-release window so a `0.1`-pinned adapter can be
#                    repointed while it upgrades. Delete this key (and the artifact)
#                    once STEM-TUITION's SUPPORTED_EXPORT_VERSION reads '1.0'.
# relation_registry_version — version of schema/relation-registry.yaml.

schema_version: '0.2'
export_version: '1.0'
legacy_export_version: '0.1'
relation_registry_version: '0.3'
